<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Dinamik Chart Uygulaması - DynamicChartCase</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" />

    <link rel="stylesheet" href="css/app.css" />

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>
<div class="container my-4">
    <h1 class="text-center mb-4">Dinamik Chart Uygulaması - DynamicChartCase</h1>

    <div class="card mb-3" id="connectionCard">
        <div class="card-header">Veritabanı Bağlantısı</div>
        <div class="card-body">
            <div class="row g-2 mb-2">
                <div class="col-sm-2">
                    <label class="form-label">Sunucu Adı</label>
                </div>
                <div class="col-sm-4">
                    <input type="text" id="serverName" class="form-control" 
                           placeholder="92.205.xxx.xxx\SQLEXPRESS,1433"/>
                </div>
            </div>
            <div class="row g-2 mb-2">
                <div class="col-sm-2">
                    <label class="form-label">Veritabanı Adı</label>
                </div>
                <div class="col-sm-4">
                    <input type="text" id="databaseName" class="form-control" 
                           placeholder="ChartSampleDB"/>
                </div>
            </div>
            <div class="row g-2 mb-2">
                <div class="col-sm-2">
                    <label class="form-label">Kullanıcı</label>
                </div>
                <div class="col-sm-4">
                    <input type="text" id="userName" class="form-control" 
                           placeholder="ChartSampleUser"/>
                </div>
            </div>
            <div class="row g-2 mb-3">
                <div class="col-sm-2">
                    <label class="form-label">Şifre</label>
                </div>
                <div class="col-sm-4">
                    <input type="password" id="password" class="form-control" 
                           placeholder="••••••"/>
                </div>
            </div>

            <button id="testConnectionBtn" class="btn btn-primary">Bağlantıyı Test Et</button>
            <span id="connectionResult" class="ms-3"></span>
        </div>
    </div>

    <div class="card mb-3" id="dataSourceCard" style="display:none;">
        <div class="card-header">Veri Kaynağı Seçimi (Tablo / View / Stored Procedure)</div>
        <div class="card-body">
            <button id="loadDataSourcesBtn" class="btn btn-secondary">Veri Kaynaklarını Yükle</button>
            <select id="dataSourceSelect" 
                    class="form-select w-50 d-inline-block ms-2"></select>
        </div>
    </div>

    <div class="card mb-3" id="chartConfigCard" style="display:none;">
        <div class="card-header">Chart Tipi ve Veri Çekme</div>
        <div class="card-body">
            <div class="mb-2">
                <label>Chart Tipi: </label>
                <select id="chartTypeSelect" class="form-select w-25 d-inline-block ms-2">
                    <option value="bar">Bar</option>
                    <option value="line">Line</option>
                    <option value="radar">Radar</option>
                </select>
            </div>
            <div class="mb-3 text-muted" style="font-size: 0.9rem;">
                (Tablo, View veya Stored Procedure seçtikten sonra 
                istediğiniz chart tipini belirleyebilirsiniz.)
            </div>
            <button id="getDataBtn" class="btn btn-success me-2">Veriyi Getir</button>
        </div>
    </div>

    <div class="card mb-3" id="mappingCard" style="display:none;">
        <div class="card-header">Kolon Eşleştirme ve Chart</div>
        <div class="card-body">
            <p class="mb-2">Kolonlar: <span id="columnList"></span></p>
            <div class="row g-2 align-items-center mb-2">
                <div class="col-auto">
                    <label for="labelColumnSelect" class="col-form-label">Label Kolonu:</label>
                </div>
                <div class="col-auto">
                    <select id="labelColumnSelect" class="form-select"></select>
                </div>
            </div>
            <div class="row g-2 align-items-center mb-3">
                <div class="col-auto">
                    <label for="valueColumnSelect" class="col-form-label">Value Kolonu:</label>
                </div>
                <div class="col-auto">
                    <select id="valueColumnSelect" class="form-select"></select>
                </div>
            </div>

            <button id="drawChartBtn" class="btn btn-primary">Chart'ı Çiz</button>
            <button id="clearChartBtn" class="btn btn-outline-danger ms-2">Chart'ı Temizle</button>

            <div class="mt-4">
                <canvas id="myChart" width="600" height="300"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
